name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fix permissions on server
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} \
            ${{ secrets.DEPLOY_PATH || '/opt/llmetrics' }}/frontend/.next/ \
            ${{ secrets.DEPLOY_PATH || '/opt/llmetrics' }}/frontend/public/ 2>/dev/null || true"

      - name: Sync build to server
        run: |
          rsync -az --delete -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            frontend/.next/standalone/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH || '/opt/llmetrics' }}/frontend/.next/standalone/
          rsync -az --delete -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            frontend/.next/static/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH || '/opt/llmetrics' }}/frontend/.next/static/
          rsync -az --delete -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            frontend/public/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH || '/opt/llmetrics' }}/frontend/public/

      - name: Restart frontend container
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH || '/opt/llmetrics' }} && \
            docker restart llmetrics_frontend_prod || \
            docker compose -f docker-compose.prod.yml up -d frontend"
